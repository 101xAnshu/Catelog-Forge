# CatalogForge on one small VM (AWS Lightsail 2 GB): app + Postgres + Redis + Caddy.
#
#   cd deploy/aws
#   cp .env.example .env    # fill in POSTGRES_PASSWORD, BASIC_AUTH_HASH, OPENCODE_API_KEY
#   docker compose up -d
#
# The app image is built locally and loaded on the server (see README.md), so there is no
# `build:` key here. The host runs Docker Engine + Compose plugin only.
name: catalogforge

services:
  app:
    image: catalogforge:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Postgres and Redis are the Compose service names; the app never leaves this Docker network.
      DATABASE_URL: postgres://catalogforge:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/catalogforge
      REDIS_URL: redis://redis:6379
      ROLE: all
      STORAGE_DIR: /data/storage
      PORT: "3000"
      SEED_DEMO: "false"
      APP_URL: ${APP_URL:?set APP_URL in .env}
    expose:
      - "3000"
    volumes:
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 2 GB host: cap the app and leave headroom for Postgres, Redis and the OS. Swap is configured
    # on the host (see README.md) so a slow AI call cannot OOM-kill the deployment.
    mem_limit: 1200m
    memswap_limit: 2400m
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 150s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalogforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: catalogforge
    command:
      - postgres
      - -c
      - max_connections=60
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - work_mem=4MB
      - -c
      - wal_compression=on
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=1GB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogforge -d catalogforge"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 512m
    memswap_limit: 768m
    shm_size: 128mb
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF keeps queued jobs across restarts; BullMQ requires noeviction.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 320m
    memswap_limit: 384m
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Caddy reads CADDY_DOMAIN, BASIC_AUTH_USER and BASIC_AUTH_HASH from .env.
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m
    memswap_limit: 192m
    logging: *logging

volumes:
  appdata:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
